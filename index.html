<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live Q&amp;A</title>

<!-- Link preview (shows when the link is shared/pasted). Edit these. -->
<meta property="og:type" content="website">
<meta property="og:title" content="Live Q&A: ask your questions">
<meta property="og:description" content="Submit your questions for the speaker.">
<!-- Optional: add a 1200x630 image hosted next to this file, then uncomment and set the full URL -->
<!-- <meta property="og:image" content="https://YOUR-SITE/qa-preview.png"> -->
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Live Q&A: ask your questions">
<meta name="twitter:description" content="Submit your questions for the speaker.">

<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden; font-family:system-ui,sans-serif; }
  video { position:fixed; inset:0; width:100%; height:100%; object-fit:contain; background:#000; }
  #tap {
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(0,0,0,.35); color:#fff; font-size:1.2rem; text-align:center; cursor:pointer;
  }
  #tap span { background:#fff; color:#000; padding:.9rem 1.4rem; border-radius:999px; font-weight:600; }
</style>
</head>
<body>

<!-- Put your video file next to this page and name it rickroll.mp4 -->
<video id="v" src="rickroll.mp4" playsinline autoplay preload="auto"></video>
<div id="tap"><span>Tap to join Q&amp;A</span></div>

<script>
  // If you can't host a video file, the page falls back to YouTube (may show ads).
  var FALLBACK_URL = "https://www.youtube.com/watch?v=dQw4w9WgXcQ";

  var v = document.getElementById("v");
  var tap = document.getElementById("tap");

  function start() {
    v.muted = false;
    v.play().then(function () {
      // Played with sound. Done.
    }).catch(function () {
      // Browser blocked sound: start muted, then unmute on the first tap.
      v.muted = true;
      v.play().catch(function () {});
      tap.style.display = "flex";
    });
  }

  tap.addEventListener("click", function () {
    v.muted = false;
    v.currentTime = 0;
    v.play();
    tap.style.display = "none";
  });

  // If the video file is missing or can't load, send them to YouTube instead.
  v.addEventListener("error", function () { location.replace(FALLBACK_URL); });

  start();
</script>

<noscript><meta http-equiv="refresh" content="0; url=https://www.youtube.com/watch?v=dQw4w9WgXcQ"></noscript>
</body>
</html>
